[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foucault-tools"
version = "1.0.0"
description = "Analysis and plotting for the foucault-pendulum C++ solver: swing-plane precession, exact solution, convergence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shahab Bahreini Jangjoo" }]
keywords = ["foucault-pendulum", "coriolis", "runge-kutta", "computational-physics", "earth-rotation"]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://shahabahreini.com/projects/foucault-pendulum/"
Repository = "https://github.com/shahabahreini/foucault-pendulum"

[project.scripts]
foucault-plot = "foucault_tools.cli:main"

[tool.setuptools.packages.find]
include = ["foucault_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
